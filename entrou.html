<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- ICONES -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="Css/index_style.css">
    <link rel="stylesheet" href="Css/board_style.css">
    <link rel="stylesheet" href="Css/painel_style.css">

    <title>PL Production</title>

</head>

<body class="animacao bg-dark text-white">

    <div class="layout">

        <!-- =========================================
             PAINEL ESQUERDO. faz o L
        ========================================== -->

        <div class="painel bg-dark">

            <!-- TOPO -->
            <div class="molde">

                <div class="logo">

                    <img src="Imagens/Catware Logo.png"
                         class="img-logo">

                    <h1 class="text-geral"
                        style="color: white; padding-top: 40px;">

                        PL Production

                    </h1>

                </div>

            </div>

            <!-- CENTRO -->
            <div class="alinhamento scroll"
                 style="padding: 20px;">

                <!-- LISTA DOS PAINEIS -->
                <div id="lista-paineis"
                     style="width: 100%;">

                </div>

                <!-- BOTAO NOVO PAINEL -->
                <button type="button"
                        style="width: 320px;"
                        class="btn btn-dark"
                        data-bs-toggle="modal"
                        data-bs-target="#modalNovoPainel">

                    Novo painel

                </button>

                <!-- SAIR -->
                <a href="index.html"
                   style="text-decoration: none;">

                    <button type="button"
                            class="btn btn-danger border-0"
                            style="width: 320px; margin-top: 10px;">

                        Sair

                    </button>

                </a>

            </div>

        </div>

        <!-- =========================================
             BOARD CENTRAL
        ========================================== -->

        <div class="lateral_botao" id="lateral_botao">



        </div>

        <div class="board" id="board">

            <!-- CONTEUDO DOS CARDS VAI AQUI -->

        </div>

        <!-- =========================================
             LADO DIREITO, Flávio 2026
        ========================================== -->

        <div class="limitacao bg-dark"
     id="limitacao"
     style="
        width: 20%;
        min-width: 320px;
        overflow-y: auto;
        border-left: 1px solid rgb(50,50,50);
     ">

</div>

    </div>

    <!-- =========================================
         MODAL NOVO PAINEL
    ========================================== -->

    <div class="modal fade"
         id="modalNovoPainel"
         tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content bg-dark text-white">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Novo Painel
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <div class="input-group mb-3">

                        <span class="input-group-text bg-dark text-white border-0">

                            Título

                        </span>

                        <input type="text"
                               id="titulo-painel"
                               class="form-control bg-dark text-white">

                    </div>

                    <div class="input-group">

                        <span class="input-group-text bg-dark text-white border-0">

                            Resumo

                        </span>

                        <textarea id="resumo-painel"
                                  class="form-control bg-dark text-white"></textarea>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-danger"
                            data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button class="btn btn-secondary"
                            onclick="adicionarPainel()"
                            data-bs-dismiss="modal">

                        Criar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <script src="Scripts/painel_script.js"></script>

    <script src="Scripts/card_script.js"></script>

    <script src="Scripts/limite_script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
